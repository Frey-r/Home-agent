# Configuración mínima de HA para desarrollo de edge-core.
# Solo este archivo se versiona; el resto de dev/ha-config/ (.storage, logs)
# lo genera HA y está en .gitignore.
homeassistant:
  name: Casa Dev
  time_zone: America/Santiago
  country: CL
  language: es
  unit_system: metric
  currency: CLP

# frontend arrastra api, auth, onboarding y websocket_api.
frontend:

# Entidades de ejemplo de todos los dominios relevantes para el agente.
demo:

scene:
  - id: modo_noche
    name: "Modo Noche"
    entities:
      light.bed_light: "off"
      light.ceiling_lights: "off"
      lock.front_door: "locked"
  - id: peliculas
    name: "Películas"
    entities:
      light.bed_light: "off"
      light.ceiling_lights:
        state: "on"
        brightness: 50

script:
  saludo:
    alias: "Saludo"
    sequence:
      - action: homeassistant.turn_on
        target:
          entity_id: light.bed_light
